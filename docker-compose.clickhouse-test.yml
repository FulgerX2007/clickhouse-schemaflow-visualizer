
services:
  zookeeper:
    image: zookeeper:3.7
    container_name: zookeeper-test
    ports:
      - "2181:2181"
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181
      - ZOOKEEPER_TICK_TIME=2000
    networks:
      - clickhouse-network

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-test-engines
    ports:
      - "9000:9000"
      - "8123:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./scripts/clickhouse_test_engines.sql:/docker-entrypoint-initdb.d/clickhouse_test_engines.sql:ro
      - ./config/clickhouse-config.xml:/etc/clickhouse-server/config.d/zookeeper.xml:ro
    environment:
      - CLICKHOUSE_DB=test_engines
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=default
      - KRAFT_CLICKHOUSE_TEST_ENGINES=1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    depends_on:
      - zookeeper
    networks:
      - clickhouse-network

  clickhouse-schemaflow-visualizer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clickhouse-schemaflow-visualizer
    ports:
      - "8080:8080"
    # Optional, and only for settings the test stack does not pin below —
    # GRAFANA_* and GIN_MODE. Marked not required so the stack still comes up
    # for a contributor who has no .env at all.
    env_file:
      - path: .env
        required: false
    environment:
      # The test stack is self-contained. These override anything .env holds,
      # because .env normally points at a real ClickHouse and pointing this
      # container at production would be both wrong and dangerous. The
      # credentials match the clickhouse service above.
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=9000
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=default
      - CLICKHOUSE_DATABASE=test_engines
      - CLICKHOUSE_SECURE=false
      - CLICKHOUSE_SKIP_VERIFY=false
      - SERVER_ADDR=:8080
    restart: unless-stopped
    depends_on:
      - clickhouse
    networks:
      - clickhouse-network

volumes:
  clickhouse-data:
    driver: local

networks:
  clickhouse-network:
    driver: bridge
