---

services:
  # ClickHouse Schema Flow Visualizer
  clickhouse-schemaflow-visualizer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clickhouse-schemaflow-visualizer
    # Published rather than network_mode: host — on macOS, Docker and Podman
    # run containers in a VM, where "host" is the VM and nothing reaches the
    # Mac. To reach a ClickHouse on this machine, set CLICKHOUSE_HOST to
    # host.docker.internal (Docker) or host.containers.internal (Podman).
    # HOST_PORT picks the port on this machine when 8080 is already taken.
    ports:
      - "${HOST_PORT:-8090}:8080"
    env_file: ".env"
    restart: unless-stopped

volumes:
  clickhouse-data:
